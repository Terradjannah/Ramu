name: Deploy signed model catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/production/**'

concurrency:
  group: signed-catalog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and release change
        env:
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          CATALOG_OWNER_APPROVED_SHA: ${{ vars.CATALOG_OWNER_APPROVED_SHA }}
        run: |
          test "$BASE_SHA" != '0000000000000000000000000000000000000000'
          python -m pip install cryptography==50.0.2
          python scripts/validate_catalog.py
          python scripts/validate_catalog_evidence.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/classify_catalog_update.py --base "$BASE_SHA" --head HEAD --last-published --enforce

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install signing dependency
        run: python -m pip install cryptography==50.0.2
      - name: Build and verify signed Pages artifact
        env:
          CATALOG_SIGNING_KEY_PEM: ${{ secrets.CATALOG_SIGNING_KEY_PEM }}
        run: |
          python scripts/build_catalog_site.py --output "$RUNNER_TEMP/buddy-pages"
          test -s "$RUNNER_TEMP/buddy-pages/catalog/v1/index.sig"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/buddy-pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
