name: Propose curated catalog updates

on:
  workflow_run:
    workflows: ['Monitor curated Hugging Face models']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-proposals
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: catalog-proposals
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Recompute from protected registry and pinned HF metadata
        id: candidate
        env:
          HF_READ_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: python scripts/propose_catalog_update.py --output "$RUNNER_TEMP/catalog-candidate"
      - name: Issue repository-scoped proposal credential
        if: steps.candidate.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open separate staging and eligible promotion PRs
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/propose_catalog_update.py --output "$RUNNER_TEMP/catalog-candidate" --publish
