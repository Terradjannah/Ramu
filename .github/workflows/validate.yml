name: Validate model catalog PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Validate candidate and protected baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CATALOG_REVIEWERS: ${{ vars.CATALOG_REVIEWERS }}
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        run: |
          python ../trusted/scripts/check_catalog_pr.py --base "$BASE_SHA" --candidate . --trusted ../trusted

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python -m pip install cryptography==50.0.2
          python -m unittest discover -s scripts -p 'test_*.py'
